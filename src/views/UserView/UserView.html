<div class="user-view">
  <header class="header">
    <h1>Users</h1>
    <div class="info-tag">User Management</div>
  </header>

  <div v-if="userStore.loading" class="loading-state">
    <div class="spinner"></div>
    Loading users...
  </div>

  <div v-else-if="userStore.error" class="error-state">
    {{ userStore.error }}
  </div>

  <div v-else class="user-grid">
    <div v-for="user in userStore.users" :key="user.id" class="user-card">
      <div class="user-avatar">
        {{ user.name.charAt(0) }}
      </div>
      <div class="user-info">
        <h3>{{ user.name }}</h3>
        <p class="email">{{ user.email }}</p>
        <p class="company">{{ user.company.name }}</p>
      </div>
    </div>
  </div>

  <div class="back-link">
    <RouterLink to="/">Back to Todos</RouterLink>
  </div>
</div>
