<div class="input-wrapper">
  <input
    v-model="newTodo"
    @keyup.enter="handleSubmit"
    type="text"
    placeholder="Add a new task..."
    :disabled="todoStore.loading"
  />
  <button @click="handleSubmit" class="add-btn" :disabled="todoStore.loading">
    <span class="icon">+</span>
  </button>
</div>
